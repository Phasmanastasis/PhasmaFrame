<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9f5" />
    <title>Alaga · Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f2f4ef;
        color: #202522;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        width: 100%;
        background: #ffffff;
        border-radius: 28px;
        padding: 2rem 1.75rem;
        text-align: left;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border-radius: 9999px;
        background: #e4f1e9;
        color: #315b49;
        font-size: 0.8125rem;
        font-weight: 600;
        padding: 0.5rem 1rem;
        margin-bottom: 1.25rem;
      }
      .dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: #3d806d; }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; color: #243e35; }
      p { margin: 0 0 1rem; color: #525f55; font-size: 1rem; }
      p:last-of-type { margin-bottom: 0; }
      a.button {
        display: inline-block;
        margin-top: 1.5rem;
        border-radius: 9999px;
        background: #366b60;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        padding: 0.85rem 1.5rem;
      }
      a.button:hover { background: #28594f; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge"><span class="dot"></span>Offline</span>
      <h1>You are offline right now</h1>
      <p>Alaga could not load this page because the device has no connection. Your saved records are not lost.</p>
      <p>Every reading you have entered stays on this device. Once you are back online, open Alaga again and your records will still be here.</p>
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
